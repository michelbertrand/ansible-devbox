---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check kube-ps1 script exists
      ansible.builtin.stat:
        path: /opt/kube-ps1/kube-ps1.sh
      register: kube_ps1_script

    - name: Assert kube-ps1 script is present
      ansible.builtin.assert:
        that: kube_ps1_script.stat.exists
