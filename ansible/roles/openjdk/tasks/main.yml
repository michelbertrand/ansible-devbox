---
- name: Install OpenJDK
  ansible.builtin.apt:
    name: "openjdk-{{ openjdk_version }}-jdk"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Verify Java installation
  ansible.builtin.command: java -version
  register: java_version
  changed_when: false
  failed_when: java_version.rc != 0
