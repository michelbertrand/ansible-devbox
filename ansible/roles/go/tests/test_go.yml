---
- name: Test Go Role
  hosts: localhost
  gather_facts: true

  roles:
    - role: go

  post_tasks:
    - name: Verify Go installation
      ansible.builtin.command: go version
      register: go_version
      changed_when: false

    - name: Display Go version
      ansible.builtin.debug:
        msg: "Go installed: {{ go_version.stdout }}"
